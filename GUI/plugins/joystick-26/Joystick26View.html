<div class="rover-joystick-container">
    <div class="joystick-canvas-wrapper">
        <canvas id="joystickCanvas"></canvas>
    </div>
    
    <div id="joystickStatus" class="joystick-status">
        Not Connected to ROS
    </div>

    <div class="speed-controls">
        <div class="speed-slider-group">
            <label for="linearSpeed">Max Linear Speed (Limit: <input type="number" id="linearMaxLimit" value="60" style="width: 50px; font-size: 0.85em; padding: 1px;">):</label>
            <input type="range" id="linearSpeed" min="0" max="60" step="0.1" value="1.0">
            <span id="linearSpeedValue" class="speed-value">1.0</span> m/s
        </div>

        <div class="speed-slider-group">
            <label for="angularSpeed">Max Angular Speed (Limit: <input type="number" id="angularMaxLimit" value="60" style="width: 50px; font-size: 0.85em; padding: 1px;">):</label>
            <input type="range" id="angularSpeed" min="0" max="60" step="0.1" value="0.5">
            <span id="angularSpeedValue" class="speed-value">0.5</span> rad/s
        </div>

        <!-- NEW: Rover Dimensions Parameters -->
        <div style="display: flex; gap: 10px; margin-top: 5px; width: 100%;">
            <div style="flex: 1;">
                <label for="roverLength" style="font-size: 0.75em;">Length (m):</label>
                <input type="number" id="roverLength" value="0.5" step="0.05" style="width: 100%; font-size: 0.85em;">
            </div>
            <div style="flex: 1;">
                <label for="roverWidth" style="font-size: 0.75em;">Width (m):</label>
                <input type="number" id="roverWidth" value="0.5" step="0.05" style="width: 100%; font-size: 0.85em;">
            </div>
        </div>
    </div>

    <!-- NEW: Live Telemetry Display for Rover Feedback -->
    <div class="drilling-control-section" id="rover-telemetry-section" style="width: 95%; max-width: 280px; padding: 10px; background: #e8eaf0; border-radius: 6px;">
        <h3 style="margin: 0 0 8px 0; font-size: 0.9em; text-align: center; color: #333;">Rover Telemetry</h3>
        <div style="display: flex; justify-content: space-around; text-align: center;">
            <div>
                <span style="font-size: 0.75em; color: #666;">Linear Vel</span><br>
                <strong id="telemetryLinearVel" style="font-size: 1.1em; color: #27ae60;">0.00</strong> <span style="font-size: 0.75em;">m/s</span>
            </div>
            <div>
                <span style="font-size: 0.75em; color: #666;">Angular Vel</span><br>
                <strong id="telemetryAngularVel" style="font-size: 1.1em; color: #27ae60;">0.00</strong> <span style="font-size: 0.75em;">rad/s</span>
            </div>
        </div>
    </div>

    <p id="joystickControlMessage" class="joystick-info-message"></p>
</div>
