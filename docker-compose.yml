services:
  gui_container:
    build:
      context: ./GUI
    network_mode: host
    container_name: gui_container
    environment:
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-1}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
    command: tail -f /dev/null

  supervisor_container:
    build:
      context: ./ROAR-Supervisor
    network_mode: host
    container_name: supervisor_container
    environment:
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-1}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
    command: ros2 launch supervisor multi_launch.py